services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    ports:
      - "8000:8000" # exposed directly too, handy for local dev without nginx
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    env_file:
      - ./telegram-bot/.env
    depends_on:
      - backend
    restart: unless-stopped

  user-mini-app:
    build:
      context: ./user-mini-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.yourdomain.com}
    expose:
      - "80"
    restart: unless-stopped

  admin-mini-app:
    build:
      context: ./admin-mini-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.yourdomain.com}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - user-mini-app
      - admin-mini-app
    restart: unless-stopped
