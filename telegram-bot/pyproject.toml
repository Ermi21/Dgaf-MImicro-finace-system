[project]
name = "job-platform-telegram-bot"
version = "0.1.0"
description = "Telegram bot - thin presentation layer, launches the User/Admin Mini Apps"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
