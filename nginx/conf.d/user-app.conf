# user.yourdomain.com -> user-mini-app container (which serves its own
# built static files via its own internal nginx - see
# user-mini-app/Dockerfile). This block just terminates the public
# hostname and forwards to that container.

server {
    listen 80;
    server_name user.yourdomain.com;

    location / {
        proxy_pass http://user-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
