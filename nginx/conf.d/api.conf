# api.yourdomain.com -> backend FastAPI service
#
# TLS: this file deliberately ships HTTP-only. For production, run
# certbot (Let's Encrypt) against this server block to obtain and
# auto-configure real certificates:
#
#   docker run -it --rm --network host \
#     -v $(pwd)/certbot/conf:/etc/letsencrypt \
#     -v $(pwd)/certbot/www:/var/www/certbot \
#     certbot/certbot certonly --standalone -d api.yourdomain.com
#
# then add a `listen 443 ssl;` server block here pointing at the
# generated cert/key (certbot also writes a ready-made include file at
# /etc/letsencrypt/options-ssl-nginx.conf you can `include`).

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
