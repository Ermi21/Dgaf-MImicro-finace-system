# admin.yourdomain.com -> admin-mini-app container (same pattern as
# user-app.conf). Consider an IP allowlist here in addition to the
# application-level permission checks, since this is the higher-value
# target of the two Mini Apps:
#
#   allow 203.0.113.0/24;
#   deny all;

server {
    listen 80;
    server_name admin.yourdomain.com;

    location / {
        proxy_pass http://admin-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
